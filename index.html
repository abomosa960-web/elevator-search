  body{font-family:Tahoma,Arial,sans-serif;background:#f3f1ec;margin:0;padding:20px;direction:rtl;}

  h2{margin:0 0 16px;font-size:20px;text-align:center;}

  .bad{background:#fbe9e2;color:#d9480f;}

  <h2>البحث عن حالة المصعد</h2>
  <div class="box">
    <input id="idInput" placeholder="رقم المصعد أو اسم المصعد" />
    <button onclick="doSearch()">بحث</button>
  </div>
  <div id="result"></div>

<script>
var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxHyILAuUDrTcjDcViFRP3u9taH8oXNxorfhRe1y2f71m_uXqeyMf_RA7BvCNEvtq6f/exec";

function doSearch(){
  var val = document.getElementById('idInput').value.trim();
  if(!val) return;
  document.getElementById('result').innerHTML = "<p style='text-align:center;color:#999'>جاري البحث...</p>";
  fetch(APPS_SCRIPT_URL + "?id=" + encodeURIComponent(val))
    .then(function(r){ return r.json(); })
    .then(render)
    .catch(function(err){
      document.getElementById('result').innerHTML = "<div class='msg'>حصل خطأ في الاتصال، جرب تاني</div>";
    });
}
var AGENT_NAMES = {
  "فوزي": "م. أحمد فوزي",
  "احمد": "أحمد ناصر"
};
function displayAgent(name){
  return AGENT_NAMES[name] || name;
}
function badge(text, ok){
  return "<span class='badge " + (ok ? 'ok' : 'bad') + "'>" + text + "</span>";
}
function fieldRow(label, value, greenIfWarranty){
  if (!value) return "";
  var display = (greenIfWarranty && value.indexOf("تحت الضمان") !== -1)
      ? badge(value, true)
      : "<span>" + value + "</span>";
  return "<div class='row'><span>" + label + "</span>" + display + "</div>";
}
function render(r){
  var el = document.getElementById('result');
  if(!r){ el.innerHTML = "<div class='msg'>لا يوجد مصعد بهذا الرقم</div>"; return; }
  if(r.error){ el.innerHTML = "<div class='msg'>"+r.error+"</div>"; return; }

  var banner = (!r.status.ok && !r.status.unknown)
      ? "<div class='alert-banner'>⚠️ العقد منتهي - يحتاج تجديد</div>"
      : "";

  var underWarranty = r.warranty && r.warranty.toString().indexOf("تحت الضمان") !== -1;
  var html = "<div class='card" + (underWarranty ? " warranty-active" : "") + "'>" + banner + "<div class='card-body'>";
  html += "<div class='row'><span>الحالة</span>" + badge(r.status.label, r.status.ok) + "</div>";
  html += fieldRow("العميل", r.customer);
  html += fieldRow("رقم الجوال", r.phone);
  html += fieldRow("الموقع", r.location);
  html += fieldRow("رقم العقد", r.contractNo);
  html += fieldRow("تاريخ الاستحقاق", r.dueDate);
  html += fieldRow("حالة الضمان", r.warranty, true);
  html += fieldRow("العنوان", r.address);
  html += fieldRow("النوع", r.elevatorType);
  html += fieldRow("المندوب", displayAgent(r.agent));
  html += fieldRow("الفني", r.technician);
  html += fieldRow("تلبية الأعطال", r.faultResponse);
  html += "</div></div>";
  el.innerHTML = html;
}
document.getElementById('idInput').addEventListener('keydown', function(e){ if(e.key==='Enter') doSearch(); });
</script>
